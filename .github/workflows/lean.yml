name: Theorem audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build without warnings
        run: lake --wfail build
      - name: Audit theorem dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true Audit.lean 2>&1 | tee audit.log
          if grep -Eq 'sorryAx|Lean.ofReduceBool|Lean.trustCompiler' audit.log; then
            echo 'Unexpected trusted axiom found.'
            exit 1
          fi
